collections:
  - name: "menu"
    label: "Denní menu"
    folder: "pages"
    create: false
    fields:
      - { label: "Titulek", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      - label: "Menu položky"
        name: "items"
        widget: "list"
        fields:
          - { label: "Název jídla", name: "name", widget: "string" }
          - { label: "Cena", name: "price", widget: "string" }
