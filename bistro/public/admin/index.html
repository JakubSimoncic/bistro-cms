<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/#/";
          });
        }
      });
    }
  </script>

  <!-- Netlify CMS z CDN -->
  <script src="https://unpkg.com/netlify-cms@2.15.72/dist/netlify-cms.js" defer></script>

  <!-- Načti vlastní widget jako obyčejný skript -->
  <script src="custom-widgets/MarkdownControl.js" defer></script>

  <!-- Vlastní inicializace CMS -->
  <script src="cms.js" defer></script>
</body>
</html>
