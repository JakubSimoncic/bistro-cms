<!DOCTYPE html>
<html lang="cs">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Moderní bistro s čerstvými bagetami, sendviči a chlebíčky na pražském Florenci.">
        <meta name="keywords" content="bistro, Florenc, chlebíčky, sendviče, bagety, jídlo, občerstvení">
                
        <link rel="icon" href="favicon.ico" sizes="any">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
        <link rel="apple-touch-icon" sizes="180x180" href="favicon-180x180.png">

        <title>Bistro Flo-renc | Denní menu</title>
        <style>
            body {  margin: 0;
                padding: 0;
                font-family: Arial, Helvetica, sans-serif;
                color:#0F3825
            }
            header {
                position: fixed;
                width: 100%;
                top: 0;
                left: 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 15px 20px;
                background: #0F3825;
                box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
                z-index: 1000;
            }
            .logo {
                    margin-left: 20px;
            }
            .logo img {
                height: 120px;
            }
            .print-only {
                display: none !important;
            }
            .screen-only {
                display: block;
            }
            #menu-toggle {
                display: none;
                font-size: 30px;
                background: none;
                border: none;
                cursor: pointer;
                color: #F5F1E3;
            }
            nav {
                display: flex;
                align-items: center;
                margin-right: 150px;
            }
            nav a {
                color: #F5F1E3;
                text-decoration: none;
                margin: 0 15px;
                font-size: 20px;
                text-transform: uppercase;
                font-weight: bold;
                transition: color 0.3s;
            }
            nav a:hover {
                color: #d4a373;
                text-decoration: underline;
            }
            span {
                width: 50px;
                color: #000000;
            }
            @media (max-width: 768px) {
                .logo img {
                    height: 80px;
                }
                #menu-toggle {
                    display: block;
                    position: absolute;
                    margin-right: 30px;
                    top: 15px;
                    right: 20px;
                }  
                nav {
                    display: none;
                    flex-direction: column;
                    position: absolute;
                    top: 100px;
                    right: 0px;
                    background: #0F3825;
                    width: 100%;
                    text-align: center;
                    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
                }
                nav a {
                    padding: 15px;
                    display: block;
                    color: #F5F1E3;
                }
                nav.show {
                    display: flex;
                }
                }
                main {
                    background-color: #FFFFFF;
                }
                footer{
                    padding-top: 140px;
                    max-width: 768px;
                    margin: 0 auto;
                    background-color: #FFFFFF;
                    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                    padding-left: 5%;
                    padding-right: 5%;
                }
                h1 {
                        font-size: 60px;
                        font-weight: bold;
                        margin-bottom: 0px;
                        text-align: center;
                        color: #0F3825;
                }
                h2 {
                    font-size: 27px;
                    margin-top: 50px;
                    margin-bottom: -10px;
                    text-align: left;
                    margin-left: 37px;
                    min-width: 0px;
                    color: #0F3825;
                }
                h3 {
                    font-size: 30px;
                    margin-top: 30px;
                    margin-bottom: 0px;
                }
                h4 {
                    color: #000000;
                    margin-top: 0px;
                    margin-bottom: 10px;
                }
                h5 {
                    text-align: center;
                    font-size: 25px;
                }

            /* Mezery mezi sekcemi menu */
            section, ul {
                margin-bottom: 15px;
            }

            /* Každá položka menu je <li> */
            li {
                display: flex;
                justify-content: space-between;
                flex-wrap: wrap;
                padding: 10px 0;
                border-bottom: 1px solid #000;
                align-items: center;
            }

            /* Text položky (název jídla), tučné místo h4 */
            li > strong {
                margin: 0;
                font-size: 18px;
                flex: 1;
                min-width: 0;
                word-wrap: break-word;
            }

            /* Popis položky */
            li > p {
                margin: 5px 0 0 0;
                font-size: 14px;
                color: #000;
                flex-basis: 100%;
                white-space: pre-wrap;

            }

            /* Cena nebo zvýrazněný text vpravo */
            li > span {
                font-weight: bold;
                white-space: nowrap;
                margin-left: 20px;
                min-width: 50px;
                text-align: right;
                color: #000;
            }

            /* Responzivita */
            @media (max-width: 764px) {
                li {
                    flex-direction: column;
                    align-items: flex-start;

                }
                li > span {
                    margin-top: 5px;
                    text-align: left;
                    margin-left: 0;
                }
            }

            /* Tiskové styly */
            @media print {

                body {
                    color: #000;
                    background: #fff;
                    margin: 0;
                    padding: 0;
                    font-family: Arial, Helvetica, sans-serif;
                }

                header {
                    position: relative !important;
                    background: none !important;
                    box-shadow: none !important;
                    padding-top: 20px !important;
                    justify-content: center !important;
                    align-items: center !important;
                }
                header .screen-only {
                    display: none !important;
                }


                .logo {
                    position: absolute !important;
                    top: 20px !important;
                    left: 30px !important;
                }
                .logo img {
                    height: 160px !important;
                }

                .nadpis {
                    display: block !important;
                    text-align: center !important;
                    margin: 0 auto 20px auto !important;
                    padding-left: 0 !important;
                    padding-right: 0 !important;
                }
                .nadpis h1 {
                    font-size: 60px !important;
                    font-weight: bold !important;
                    color: #000 !important;
                    margin-bottom: 0 !important;
                }

                /* Skrytí navigace a tlačítek */
                nav, #menu-toggle {
                    display: none !important;
                }

                /* Footer (kde je menu) zobrazit jako main area */
                footer {
                    padding-top: 0 !important;
                    max-width: 768px !important;
                    margin: 10px auto 0 auto !important;
                    background: #fff !important;
                    box-shadow: none !important;
                    padding-left: 0 !important;
                    padding-right: 3% !important;
                }

                /* Oprava barev a stylu textu (v menu) */
                h2 {
                    font-size: 27px !important;
                    margin-top: 50px !important;
                    margin-bottom: -10px !important;
                    text-align: left !important;
                    margin-left: 37px !important;
                    color: #000 !important;
                }
                h3 {
                    font-size: 30px !important;
                    margin-top: 30px !important;
                    margin-bottom: 0 !important;
                    color: #000 !important;
                }
                h4 {
                    color: #000 !important;
                    margin-top: 0 !important;
                    margin-bottom: 10px !important;
                }
                h5 {
                    text-align: center !important;
                    font-size: 25px !important;
                    color: #000 !important;
                }

                /* Položky menu - černé, s podtržením */
                li {
                    display: flex !important;
                    justify-content: space-between !important;
                    border-bottom: 1px solid #000 !important;
                    padding: 10px 0 !important; 
                    color: #000 !important;
                    align-items: flex-start !important;
                }

                li > strong {
                    font-size: 18px !important;
                    font-weight: bold !important;
                    color: #000 !important;
                    flex: 1 1 auto !important;
                    max-width: calc(100% - 60px) !important;
                    word-wrap: break-word !important;
                }

                li > p {
                    font-size: 14px !important;
                    color: #000 !important;
                    white-space: pre-wrap !important;
                    flex-basis: auto !important;
                    margin-right: 5px !important;
                }

                li > span {
                    color: #000 !important;
                    margin-left: auto !important;
                    text-align: right !important;
                    min-width: 50px !important;
                    white-space: nowrap !important;
                }

                /* Skryjeme odkazy a interaktivní prvky */
                a {
                    color: black !important;
                    text-decoration: none !important;
                    pointer-events: none !important;
                }
                .print-only {
                    display: block !important;
                    text-align: center !important;
                    font-size: 60px !important;
                    font-weight: bold !important;
                    color: #000 !important;
                    margin-bottom: 0px !important;
                    padding: 0 !important;
                }
            }
        </style>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </head>
    <body>
        <header>
            <div class="logo screen-only">
                <a href="index.html">
                    <img src="LOGO.png" alt="BISTRO FLORENC" loading="lazy">
                </a>
            </div>
            <div class="print-only">
                <div class="logo">
                    <img src="LOGO2.png" alt="BISTRO FLORENC" loading="lazy">
                </div>
                <div>
                    <h1>DENNÍ MENU</h1>
                </div>
            </div>
            <button id="menu-toggle">☰</button>
            <nav id="nav-menu">
                <a href="O_NAS.html">O NÁS</a>
                <a href="MENU.html">DENNÍ MENU</a>
                <a href="NASE_NABIDKA.html">NAŠE NABÍDKA</a>
                <a href="KONTAKT.html">KONTAKT</a>
                <a href="GALERIE.html">GALERIE</a>
            </nav>  
        </header>
              <footer>
                <section id="menu-content" class="markdown">Načítám denní menu...</section>
              </footer>
        <script>
            document.getElementById('menu-toggle').addEventListener('click', function() {
                document.getElementById('nav-menu').classList.toggle('show');
            });
             fetch('pages/denni-menu.md')
        .then(response => response.text())
        .then(markdown => {
            const content = markdown.replace(/^---[\s\S]*?---\s*/, '');
            const html = marked.parse(content);
            document.getElementById('menu-content').innerHTML = html;
        })
        .catch(error => {
            document.getElementById('menu-content').innerHTML = 'Nepodařilo se načíst denní menu.';
            console.error(error);
        });
        </script>
    </body>
</html>
