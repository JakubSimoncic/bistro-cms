        <title>Bistro Florenc | PHOTOGALLERY</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: Arial, Helvetica, sans-serif;
                color:#0F3825
            }
            main {
                padding-top: 160px;

                background-color: #FFFFFF;
                }
            .galerie {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 30px;
                margin-top: 60px;
                padding-bottom: 20px;
            }
            .galerie-img {
                width: 100%;
                height: 250px;
                border-radius: 10px;
                object-fit: cover;
                transition: 0.3s ease-in-out;
            }
            .galerie-img:hover {
                transform: scale(1.1);
            }
            h1 {
                font-size: 60px;
                margin-top: 20px;
                margin-bottom: 20px;
                color: #0F3825;
            }
            .lightbox {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                display: none;
                justify-content: center;
                align-items: center;
                z-index: 2000;
            }
            .lightbox img {
                max-width: 90%;
                max-height: 80vh;
                border-radius: 10px;
            }
            .lightbox .close {
                position: absolute;
                top: 20px;
                right: 30px;
                font-size: 80px;
                color: white;
                cursor: pointer;
                background: none;
                border: none;
            }
            .arrow {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                font-size: 80px;
                color: white;
                cursor: pointer;
                background: none;
                border: none;
                padding: 20px;
            }
            .arrow-left {
                left: 20px;
            }
            .arrow-right {
                right: 20px;
            }
        </style>

            <div id="lightbox" class="lightbox">
                <button class="close" onclick="closeLightbox()">&times;</button>
                <button class="arrow arrow-left" onclick="changeImage(-1)">&#10094;</button>
                <img id="lightbox-img">
                <button class="arrow arrow-right" onclick="changeImage(1)">&#10095;</button>
            </div>
        </main>
        <script>
            let images = document.querySelectorAll(".galerie-img");
            let currentIndex = 0;
            
            function openLightbox(imgElement) {
                currentIndex = Array.from(images).indexOf(imgElement);
                document.getElementById("lightbox-img").src = imgElement.src;
                document.getElementById("lightbox").style.display = "flex";
            }

            function closeLightbox() {
                document.getElementById("lightbox").style.display = "none";
            }
            
            function changeImage(direction) {
                currentIndex = (currentIndex + direction + images.length) % images.length;
                document.getElementById("lightbox-img").src = images[currentIndex].src;
            }
            
            document.addEventListener("keydown", function(event) {
                if (document.getElementById("lightbox").style.display === "flex") {
                    if (event.key === "ArrowRight") changeImage(1);
                    if (event.key === "ArrowLeft") changeImage(-1);
                    if (event.key === "Escape") closeLightbox();
                }
            });
            document.getElementById("menu-toggle").addEventListener("click", function() {
            document.getElementById("nav-menu").classList.toggle("show");
            });
    // >>> Scroll efekt pro hlavičku s prahem
    const header = document.querySelector("header");    
    let lastScroll = 0;
    const delta = 50; // hlavička reaguje jen při větším scrollu
    window.addEventListener("scroll", () => {
        const currentScroll = window.pageYOffset;

        if (Math.abs(currentScroll - lastScroll) < delta) return;

        if (currentScroll > lastScroll && currentScroll > 100) {
            // scroll dolů → skrýt hlavičku
            header.style.transform = "translateY(-100%)";
        } else {
            // scroll nahoru → zobrazit hlavičku
            header.style.transform = "translateY(0)";
        }

        lastScroll = currentScroll;
    });
        </script>
