        <script>
            document.addEventListener("DOMContentLoaded", function() {
        const menuButton = document.getElementById('menu-toggle');
        const navMenu = document.getElementById('nav-menu');
    
        if (!menuButton || !navMenu) {
            console.error("❌ Element menu-toggle nebo nav-menu nebyl nalezen!");
            return;
        }
    
        menuButton.addEventListener('click', function() {
            navMenu.classList.toggle('show');
            console.log("✅ Menu přepnuto!");
        });
    });
    // >>> Scroll efekt pro hlavičku s prahem
    const header = document.querySelector("header");
    let lastScroll = 0;
    const delta = 50; // hlavička reaguje jen při větším scrollu
    window.addEventListener("scroll", () => {
        const currentScroll = window.pageYOffset;

        if (Math.abs(currentScroll - lastScroll) < delta) return;

        if (currentScroll > lastScroll && currentScroll > 100) {
            // scroll dolů → skrýt hlavičku
            header.style.transform = "translateY(-100%)";
        } else {
            // scroll nahoru → zobrazit hlavičku
            header.style.transform = "translateY(0)";
        }

        lastScroll = currentScroll;
    });
        </script>
