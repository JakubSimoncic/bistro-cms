<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Map Bistro Florenc</title>
<link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet"/>
<style>
html, body, #map { height:100%; margin:0; padding:0; }

#consent-banner {
    position: fixed; bottom:0; left:0; right:0;
    background:#222; color:#fff; padding:10px;
    text-align:center; z-index:9999; font-family:sans-serif;
}
#consent-banner button {
    margin-left:10px; padding:5px 10px; cursor:pointer;
}
#consent-banner button:hover { scale:1.05; background-color:#4ff749; }

#navigate-btn {
    position: fixed; top:30px; right:30px;
    z-index:9999; padding:10px 15px;
    font-size:16px; background-color:#222;
    color:#fff; border:2px solid #fff;
    border-radius:8px; cursor:pointer;
}
#navigate-btn:hover { scale:1.05; }
#navigate-btn:active { background-color:#555; }
</style>
</head>
<body>

<div id="consent-banner">
    <span id="consent-text"></span>
    <button id="consent-yes"></button>
</div>

<div id="map"></div>
<button id="navigate-btn">Navigovat</button>

<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
<script>
// --- Překlady ---
const translations = {
    cs: { text:"Souhlasíte se zobrazením Vaší aktuální polohy na mapě?", button:"Souhlasím" },
    en: { text:"Do you consent to displaying your current location on the map?", button:"I consent" }
};
const userLang = navigator.language.split('-')[0];
const lang = translations[userLang]?userLang:'en';
document.getElementById('consent-text').textContent = translations[lang].text;
document.getElementById('consent-yes').textContent = translations[lang].button;

// --- Inicializace mapy ---
const map = new maplibregl.Map({
    container: 'map',
    style: 'https://demotiles.maplibre.org/style.json',
    center: [14.4399,50.0896],
    zoom: 18,
    pitch: 0,
    bearing: 0
});

// --- Přidání navigační trasy ---
const route = [
    [14.4405633,50.0894811],
    [14.4404008,50.0895775],
    [14.4401647,50.0900086],
    [14.4398969,50.0899431],
    [14.4398225,50.0900994],
    [14.4400336,50.0901481]
];
map.on('load', () => {
    map.addSource('route', {
        'type':'geojson',
        'data':{
            'type':'Feature',
            'geometry':{
                'type':'LineString',
                'coordinates': route
            }
        }
    });
    map.addLayer({
        'id':'route-line',
        'type':'line',
        'source':'route',
        'layout': {'line-join':'round','line-cap':'round'},
        'paint': {'line-color':'blue','line-width':4}
    });
});

// --- Bistro marker ---
const bistroLatLng = [14.4400336,50.0901481];
const bistroPng = 'LOGO2.png';
const bistroMarker = document.createElement('div');
bistroMarker.style.width='35px';
bistroMarker.style.height='35px';
bistroMarker.style.border='3px solid black';
bistroMarker.style.borderRadius='50%';
bistroMarker.style.backgroundColor='white';
bistroMarker.style.overflow='hidden';
bistroMarker.style.display='flex';
bistroMarker.style.alignItems='center';
bistroMarker.style.justifyContent='center';
const img = document.createElement('img');
img.src=bistroPng;
img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover';
bistroMarker.appendChild(img);
new maplibregl.Marker(bistroMarker).setLngLat(bistroLatLng).addTo(map);

// --- Kuželový marker uživatele ---
let userMarkerEl = document.createElement('div');
userMarkerEl.style.width='16px'; userMarkerEl.style.height='33px';
userMarkerEl.innerHTML = `
<svg width="16" height="33" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(0,100,255,0.7)"/>
      <stop offset="100%" stop-color="rgba(0,100,255,0)"/>
    </linearGradient>
  </defs>
  <polygon points="8,33 0,8 16,8" fill="url(#grad)"/>
  <circle cx="8" cy="33" r="8" fill="#66b3ff" stroke="#fff" stroke-width="2"/>
</svg>`;
let userMarker = new maplibregl.Marker({element:userMarkerEl, anchor:'bottom'}).setLngLat([14.4399,50.0896]);

let followUser = false;

// --- Consent button ---
document.getElementById('consent-yes').addEventListener('click', ()=>{
    document.getElementById('consent-banner').style.display='none';
    initGeolocation();
});

// --- Navigate button ---
document.getElementById('navigate-btn').addEventListener('click', ()=>{
    followUser=true;
    // Plynulý 3D naklonění mapy
    map.easeTo({pitch:60,bearing:0,duration:2000});
});

function initGeolocation(){
    if(navigator.geolocation){
        navigator.geolocation.watchPosition(pos=>{
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const newLngLat = [lon,lat];

            // --- První umístění markeru ---
            if(!userMarker.getLngLat){
                userMarker.setLngLat(newLngLat).addTo(map);
            } else {
                // --- Plynulý přesun ---
                const start = userMarker.getLngLat();
                const duration = 1000;
                const startTime = performance.now();
                function animate(time){
                    const t = Math.min((time-startTime)/duration,1);
                    const lng = start.lng + (newLngLat[0]-start.lng)*t;
                    const lat = start.lat + (newLngLat[1]-start.lat)*t;
                    userMarker.setLngLat([lng,lat]);
                    if(t<1) requestAnimationFrame(animate);
                }
                requestAnimationFrame(animate);
            }

            // --- Sledování uživatele ---
            if(followUser){
                map.easeTo({center:newLngLat, duration:500});
            }

        },err=>console.warn('Nelze zjistit polohu:',err.message),
        {enableHighAccuracy:true});
    }

    if(window.DeviceOrientationEvent){
        window.addEventListener('deviceorientationabsolute', e=>{
            const alpha = e.alpha||0;
            userMarkerEl.style.transform = `rotate(${alpha}deg)`;
        },true);
    }
}
</script>
</body>
</html>
