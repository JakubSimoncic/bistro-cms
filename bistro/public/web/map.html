<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Bistro Florenc 3D mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css"/>
  <style>
    html, body, #map { height:100%; margin:0; padding:0; }
    #consent-banner {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #222; color: #fff; padding: 10px;
      text-align: center; z-index: 9999; font-family: sans-serif;
    }
    #consent-banner button {
      margin-left:10px; padding:5px 10px; cursor:pointer;
    }
    #consent-banner button:hover {
      scale: 1.05; background-color: #4ff749;
    }
    #navigate-btn {
      position: fixed; top: 30px; right: 30px;
      z-index: 9999; padding: 10px 15px;
      font-size: 16px; background-color: #222;
      color: #fff; border: 2px solid #fff;
      border-radius: 8px; cursor: pointer;
    }
    #navigate-btn:hover { scale: 1.05; }
  </style>
</head>
<body>
  <div id="consent-banner">
    <span id="consent-text"></span>
    <button id="consent-yes"></button>
  </div>

  <div id="map"></div>
  <button id="navigate-btn">Navigovat</button>

  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script>
    // --- Překlady ---
    const translations = {
      cs: { text: "Souhlasíte se zobrazením Vaší aktuální polohy na mapě?", button: "Souhlasím" },
      en: { text: "Do you consent to displaying your current location on the map?", button: "I consent" }
    };
    const userLang = navigator.language.split('-')[0];
    const lang = translations[userLang] ? userLang : 'en';
    document.getElementById('consent-text').textContent = translations[lang].text;
    document.getElementById('consent-yes').textContent = translations[lang].button;

    // --- MapLibre GL setup ---
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://api.maptiler.com/maps/streets/style.json?key=Pc9uiLvzyWXr8WnVXScH',
      center: [14.4399, 50.0896], // Florenc
      zoom: 17,
      pitch: 60,
      bearing: -20,
      antialias: true
    });

    map.addControl(new maplibregl.NavigationControl());

    map.on('load', () => {
      // --- 3D budovy ---
      const layers = map.getStyle().layers;
      let labelLayerId;
      for (let i = 0; i < layers.length; i++) {
        if (layers[i].type === 'symbol' && layers[i].layout['text-field']) {
          labelLayerId = layers[i].id;
          break;
        }
      }

      map.addLayer({
        'id': '3d-buildings',
        'source': 'openmaptiles',
        'source-layer': 'building',
        'type': 'fill-extrusion',
        'minzoom': 15,
        'paint': {
          'fill-extrusion-color': '#aaa',
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['get', 'min_height'],
          'fill-extrusion-opacity': 0.6
        }
      }, labelLayerId);

      // --- Marker Bistra Florenc ---
      const bistro = [14.4399, 50.0896];
      const bistroMarker = new maplibregl.Marker({ color: "#FF4500" })
        .setLngLat(bistro)
        .setPopup(new maplibregl.Popup().setHTML("<b>Bistro Florenc</b><br>Praha 8"))
        .addTo(map);
    });

    // --- Kužel marker pro uživatele ---
    function createUserIcon(angle = 0) {
      const svg = `
        <svg width="20" height="30" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="0" y2="25">
              <stop offset="0%" stop-color="rgba(0,100,255,0.7)"/>
              <stop offset="100%" stop-color="rgba(0,100,255,0)"/>
            </linearGradient>
          </defs>
          <polygon points="10,30 0,10 20,10" fill="url(#grad)" />
          <circle cx="10" cy="27" r="5" fill="#66b3ff" stroke="#fff" stroke-width="2"/>
        </svg>
      `;
      const el = document.createElement('div');
      el.innerHTML = svg;
      return el;
    }

    let userMarker = null;
    let followUser = false;

    document.getElementById('consent-yes').addEventListener('click', () => {
      document.getElementById('consent-banner').style.display = 'none';
      initGeolocation();
    });

    document.getElementById('navigate-btn').addEventListener('click', () => {
      followUser = true;
    });

    function initGeolocation() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const userPos = [lon, lat];

          if (!userMarker) {
            userMarker = new maplibregl.Marker({ element: createUserIcon() })
              .setLngLat(userPos)
              .addTo(map);
          } else {
            userMarker.setLngLat(userPos);
          }

          if (followUser) map.easeTo({ center: userPos });

          drawRoute(userPos, [14.4399, 50.0896]); // Bistro Florenc
        },
        err => console.warn('Nelze zjistit polohu:', err.message),
        { enableHighAccuracy: true });
      }
    }

    // --- Trasa mezi uživatelem a Bistrem ---
    function drawRoute(start, end) {
      const routeId = "user-to-bistro";
      const routeData = {
        "type": "FeatureCollection",
        "features": [{
          "type": "Feature",
          "geometry": {
            "type": "LineString",
            "coordinates": [start, end]
          }
        }]
      };

      if (map.getSource(routeId)) {
        map.getSource(routeId).setData(routeData);
      } else {
        map.addSource(routeId, { type: "geojson", data: routeData });
        map.addLayer({
          id: routeId,
          type: "line",
          source: routeId,
          layout: { "line-join": "round", "line-cap": "round" },
          paint: { "line-color": "#007AFF", "line-width": 5 }
        });
      }
    }
  </script>
</body>
</html>
