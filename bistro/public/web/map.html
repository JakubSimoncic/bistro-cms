<!doctype html>
<html lang="cs">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>Map Bistro Florenc 3D</title>
        <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css"/>
        <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
        <style>
        html, body, #map { height:100%; margin:0; padding:0; }
        #consent-banner {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #222; color: #fff; padding: 10px;
            text-align: center; z-index: 9999; font-family: sans-serif;
        }
        #consent-banner button {
            margin-left:10px; padding:5px 10px; cursor:pointer;
        }
        #consent-banner button:hover { scale: 1.05; background-color: #4ff749; }
        
        #navigate-btn, #view-2d, #view-3d {
            position: fixed; z-index: 9999;
            padding: 10px 15px; font-size: 16px;
            background-color: #222; color: #fff;
            border: 2px solid #fff; border-radius: 8px; cursor:pointer;
        }
        #navigate-btn, #view-3d { right: 50px; }
        #view-2d { right: 110px; }
        #navigate-btn:hover, #view-2d:hover, #view-3d:hover { scale: 1.05; }
        #navigate-btn:active, #view-2d:active, #view-3d:active { background-color: #555; }
        
        #navigate-btn { top: 20px; }
        #view-2d, #view-3d { top: 70px; }
        </style>
    </head>
    <body>
        <div id="consent-banner">
            <span id="consent-text"></span>
            <button id="consent-yes"></button>
        </div>
        
        <div id="map"></div>
        <button id="navigate-btn">Navigovat</button>
        <button id="view-2d">2D</button>
        <button id="view-3d">3D</button>
        
        <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
        <script>
        // --- Vícejazyčný systém ---
        const translations = {
            cs: { consentText: "Souhlasíte se zobrazením Vaší aktuální polohy na mapě?", consentBtn: "Souhlasím", navigate: "Navigovat", stopNavigate: "Ukončit navigaci", view2d: "2D", view3d: "3D" },
            en: { consentText: "Do you consent to displaying your current location on the map?", consentBtn: "I consent", navigate: "Navigate", stopNavigate: "Stop navigation", view2d: "2D", view3d: "3D" },
            es: { consentText: "¿Acepta mostrar su ubicación actual en el mapa?", consentBtn: "Acepto", navigate: "Navegar", stopNavigate: "Detener navegación", view2d: "2D", view3d: "3D" },
            fr: { consentText: "Acceptez-vous d'afficher votre position actuelle sur la carte ?", consentBtn: "J'accepte", navigate: "Naviguer", stopNavigate: "Arrêter la navigation", view2d: "2D", view3d: "3D" },
            de: { consentText: "Stimmen Sie der Anzeige Ihres aktuellen Standorts auf der Karte zu?", consentBtn: "Ich stimme zu", navigate: "Navigieren", stopNavigate: "Navigation beenden", view2d: "2D", view3d: "3D" },
            zh: { consentText: "您同意在地图上显示您当前的位置吗？", consentBtn: "我同意", navigate: "导航", stopNavigate: "停止导航", view2d: "2D", view3d: "3D" },
            hi: { consentText: "क्या आप अपने वर्तमान स्थान को मानचित्र पर दिखाने की अनुमति देते हैं?", consentBtn: "मैं सहमत हूँ", navigate: "नेविगेट करें", stopNavigate: "नेविगेशन रोकें", view2d: "2D", view3d: "3D" },
            ar: { consentText: "هل توافق على عرض موقعك الحالي على الخريطة؟", consentBtn: "أوافق", navigate: "التنقل", stopNavigate: "إيقاف التنقل", view2d: "2D", view3d: "3D" },
            ru: { consentText: "Вы согласны с отображением вашего текущего местоположения на карте?", consentBtn: "Согласен", navigate: "Навигация", stopNavigate: "Остановить навигацию", view2d: "2D", view3d: "3D" },
            pt: { consentText: "Você concorda em exibir sua localização atual no mapa?", consentBtn: "Concordo", navigate: "Navegar", stopNavigate: "Parar navegação", view2d: "2D", view3d: "3D" },
            ja: { consentText: "現在地を地図に表示することに同意しますか？", consentBtn: "同意します", navigate: "ナビゲート", stopNavigate: "ナビゲーション停止", view2d: "2D", view3d: "3D" },
            bn: { consentText: "আপনি কি আপনার বর্তমান অবস্থান মানচিত্রে প্রদর্শনের জন্য সম্মত?", consentBtn: "আমি সম্মত", navigate: "নেভিগেট করুন", stopNavigate: "নেভিগেশন বন্ধ করুন", view2d: "2D", view3d: "3D" },
            pa: { consentText: "ਕੀ ਤੁਸੀਂ ਆਪਣੇ ਮੌਜੂਦਾ ਸਥਾਨ ਨੂੰ ਨਕਸ਼ੇ 'ਤੇ ਦਿਖਾਉਣ ਦੀ ਸਹਿਮਤੀ ਦਿੰਦੇ ਹੋ?", consentBtn: "ਮੈਂ ਸਹਿਮਤ ਹਾਂ", navigate: "ਨੈਵੀਗੇਟ ਕਰੋ", stopNavigate: "ਨੈਵੀਗੇਸ਼ਨ ਬੰਦ ਕਰੋ", view2d: "2D", view3d: "3D" },
            jv: { consentText: "Apa sampeyan sarujuk kanggo nampilake lokasi sampeyan saiki ing peta?", consentBtn: "Aku sarujuk", navigate: "Navigasi", stopNavigate: "Berhenti navigasi", view2d: "2D", view3d: "3D" },
            ko: { consentText: "지도에 현재 위치를 표시하는 것에 동의하십니까?", consentBtn: "동의합니다", navigate: "탐색", stopNavigate: "탐색 중지", view2d: "2D", view3d: "3D" },
            vi: { consentText: "Bạn có đồng ý hiển thị vị trí hiện tại của mình trên bản đồ không?", consentBtn: "Tôi đồng ý", navigate: "Điều hướng", stopNavigate: "Dừng điều hướng", view2d: "2D", view3d: "3D" },
            te: { consentText: "మీరు మీ ప్రస్తుత స్థానాన్ని మ్యాప్లో చూపించడానికి అంగీకరిస్తున్నారా?", consentBtn: "నేను అంగీకరిస్తున్నాను", navigate: "నావిగేట్ చేయండి", stopNavigate: "నావిగేషన్ ఆపు", view2d: "2D", view3d: "3D" },
            mr: { consentText: "आप नकाशावर आपले वर्तमान स्थान दाखविण्यास सहमत आहात का?", consentBtn: "मी सहमत आहे", navigate: "नेव्हिगेट करा", stopNavigate: "नेव्हिगेशन थांबवा", view2d: "2D", view3d: "3D" },
            ta: { consentText: "நீங்கள் உங்கள் தற்போதைய இடத்தை வரைபட்டில் காட்டுுவதற்கு ஒப்புக்கொள்கிறீர்களா?", consentBtn: "நான் ஒப்புக்கொள்கிறேன்", navigate: "வழிசெலுத்தவும்", stopNavigate: "வழிசெலுத்தலை நிறுத்தவும்", view2d: "2D", view3d: "3D" },
            ur: { consentText: "کیا آپ اپنے موجودہ مقام کو نقشے پر دکھانے کی اجازت دیتے ہیں؟", consentBtn: "میں متفق ہوں", navigate: "نیویگیٹ کریں", stopNavigate: "نیویگیشن بند کریں", view2d: "2D", view3d: "3D" },
            it: { consentText: "Accetti di mostrare la tua posizione attuale sulla mappa?", consentBtn: "Accetto", navigate: "Naviga", stopNavigate: "Interrompi navigazione", view2d: "2D", view3d: "3D" },
            tr: { consentText: "Mevcut konumunuzu haritada göstermeyi kabul ediyor musunuz?", consentBtn: "Kabul ediyorum", navigate: "Navigasyon", stopNavigate: "Navigasyonu durdur", view2d: "2D", view3d: "3D" }
        };
        
        const userLang = navigator.language.split('-')[0];
        const lang = translations[userLang] ? userLang : 'en';
        
        document.getElementById('consent-text').textContent = translations[lang].consentText || translations['en'].consentText;
        document.getElementById('consent-yes').textContent = translations[lang].consentBtn || translations['en'].consentBtn;
        document.getElementById('navigate-btn').textContent = translations[lang].navigate || translations['en'].navigate;
        document.getElementById('view-2d').textContent = translations[lang].view2d || translations['en'].view2d;
        document.getElementById('view-3d').textContent = translations[lang].view3d || translations['en'].view3d;
        
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://api.maptiler.com/maps/streets/style.json?key=Pc9uiLvzyWXr8WnVXScH',
            center: [14.4400336, 50.0901481],
            zoom: 18,
            pitch: 0,
            bearing: 0,
            antialias: true
        });
        map.addControl(new maplibregl.NavigationControl());
        
        const route = {
            type: 'Feature',
            geometry: { type: 'LineString',
                coordinates: [
                    [14.4405633, 50.0894811],
                    [14.4403464, 50.0895953], //2 
                    [14.4401647, 50.0900086], //3
                    [14.4398969, 50.0899431],
                    [14.4398225, 50.0900994],
                    [14.4400336, 50.0901481]
                ]
            }
        };

        let completedRoute = {
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: [] }
        };
        
        map.on('load', () => {
            map.addSource('route', { type: 'geojson', data: route });
            map.addLayer({
                id: 'route-line', type: 'line', source: 'route',
                layout: { 'line-cap': 'round', 'line-join': 'round' },
                paint: { 'line-color': '#0066ff', 'line-width': 5 }
            });

            // --- Vrstva pro již projitou trasu ---
            map.addSource('completed-route', {
                type: 'geojson',
                data: completedRoute
            });
            
            map.addLayer({
                id: 'completed-line',
                type: 'line',
                source: 'completed-route',
                layout: { 'line-cap': 'round', 'line-join': 'round' },
                paint: {
                    'line-color': '#66b3ff', // světle modrá
                    'line-width': 5
                }
            });

            // --- Fit map to show the entire route ---
            const bounds = route.geometry.coordinates.reduce(
                (b, coord) => b.extend(coord),
                new maplibregl.LngLatBounds(route.geometry.coordinates[0], route.geometry.coordinates[0])
            );
            map.fitBounds(bounds, { padding: { top: 50, bottom: 120, left: 50, right: 50 } });
            
            const bistroEl = document.createElement('div');
            const img = document.createElement('img');
            img.src = 'LOGO2.png';
            img.style.width = '35px'; img.style.height = '35px';
            img.style.borderRadius = '50%';
            img.style.border = '3px solid black';
            img.style.background = 'white';
            img.style.objectFit = 'cover';
            bistroEl.appendChild(img);
        
            new maplibregl.Marker(bistroEl)
                .setLngLat([14.4400336, 50.0901481])
                .addTo(map);
        
            const layers = map.getStyle().layers;
            let labelLayerId;
            for (let i = 0; i < layers.length; i++) {
                if (layers[i].type === 'symbol' && layers[i].layout['text-field']) {
                    labelLayerId = layers[i].id;
                    break;
                }
            }
            
            // Opravený zdroj 3D budov
            const buildingSource = Object.keys(map.getStyle().sources).find(s => map.getStyle().sources[s].type === 'vector' && map.getStyle().sources[s]['url']?.includes('openmaptiles'));
            
            if (buildingSource) {
                map.addLayer({
                    id: '3d-buildings',
                    source: buildingSource,
                    'source-layer': 'building',
                    type: 'fill-extrusion',
                    minzoom: 15,
                    paint: {
                        'fill-extrusion-color': '#aaa',
                        'fill-extrusion-height': ['get', 'height'],
                        'fill-extrusion-base': ['get', 'min_height'],
                        'fill-extrusion-opacity': 0.6
                    }
                }, labelLayerId);
            }
        });
        
        let userMarker = null;
        let userHeadingMarker = null;
        let followUser = false;
        let navigating = false;
        let returnTimer = null;
        let watchId = null;
            
        
        function resetReturnTimer() {
            if (!navigating) return;
            if (returnTimer) clearTimeout(returnTimer);
            returnTimer = setTimeout(() => {
                if (userMarker && navigating) {
                    const coords = userMarker.getLngLat();
                    map.easeTo({ center: [coords.lng, coords.lat], duration: 1000 });
                }
            }, 5000);
        }
        
        ['dragstart', 'zoomstart'].forEach(evt => map.on(evt, resetReturnTimer));
        
        document.getElementById('view-2d').addEventListener('click', () => {
            map.easeTo({ pitch: 0, bearing: 0, duration: 1000 });
            resetReturnTimer();
        });
        
        document.getElementById('view-3d').addEventListener('click', () => {
            map.easeTo({ pitch: 60, bearing: -20, duration: 1000 });
            resetReturnTimer();
        });
        
        document.getElementById('consent-yes').addEventListener('click', () => {
            document.getElementById('consent-banner').style.display = 'none';
            initGeolocation();
        });
        
        document.getElementById('navigate-btn').addEventListener('click', () => {
            if (!navigating) {
                navigating = true;
                followUser = true;
                map.easeTo({ pitch: 60, bearing: -20, zoom: 18, duration: 3000 });
                document.getElementById('navigate-btn').textContent = translations[lang].stopNavigate || translations['en'].stopNavigate;
                resetReturnTimer();
            } else {
                navigating = false;
                followUser = false;
                map.easeTo({ pitch: 0, bearing: 0, zoom: 18, duration: 3000 });
                document.getElementById('navigate-btn').textContent = translations[lang].navigate || translations['en'].navigate;
                if (returnTimer) clearTimeout(returnTimer);
            }
        });
        
        function updateRouteProgress(userCoords) {
            if (!route.geometry.coordinates.length) return;
        
            const coords = route.geometry.coordinates;
            let closestIndex = 0;
            let minDist = Infinity;
        
            for (let i = 0; i < coords.length; i++) {
                const dx = userCoords[0] - coords[i][0];
                const dy = userCoords[1] - coords[i][1];
                const dist = dx * dx + dy * dy;
                if (dist < minDist) {
                    minDist = dist;
                    closestIndex = i;
                }
            }
        
            // označ část trasy jako projitou
            completedRoute.geometry.coordinates = coords.slice(0, closestIndex + 1);
            map.getSource('completed-route').setData(completedRoute);
        
            // Interpolace mezi posledním bodem a aktuálním
            const nextIndex = Math.min(closestIndex + 1, coords.length - 1);
            const prev = coords[closestIndex];
            const next = coords[nextIndex];
            const t = Math.min(
                Math.sqrt(minDist) /
                Math.sqrt(Math.pow(next[0] - prev[0], 2) + Math.pow(next[1] - prev[1], 2)),
                1
            );
        
            const interpLng = prev[0] + (next[0] - prev[0]) * t;
            const interpLat = prev[1] + (next[1] - prev[1]) * t;
        
            if (userMarker) userMarker.setLngLat([interpLng, interpLat]);
            if (userHeadingMarker) userHeadingMarker.setLngLat([interpLng, interpLat]);
        }
        
function initGeolocation() {
    if (!navigator.geolocation) return;

    let lastCoords = null;
    let smoothedHeading = 0;

    // --- Cone marker ---
    const coneEl = document.createElement('div');
    coneEl.style.width = '0';
    coneEl.style.height = '0';
    coneEl.style.borderLeft = '10px solid transparent';
    coneEl.style.borderRight = '10px solid transparent';
    coneEl.style.borderTop = '20px solid rgba(0,123,255,0.7)';
    coneEl.style.transformOrigin = '50% 0%';
    coneEl.style.position = 'relative';
    coneEl.style.top = '-20px';
    coneEl.style.pointerEvents = 'none';

    const center = map.getCenter();
    userHeadingMarker = new maplibregl.Marker(coneEl).setLngLat([center.lng, center.lat]).addTo(map);

    let headingFromCompass = null;

    function enableCompass() {
        window.addEventListener('deviceorientationabsolute', (event) => {
            if (event && event.alpha !== null) {
                headingFromCompass = 360 - event.alpha; 
            }
        }, true);

        window.addEventListener('deviceorientation', (event) => {
            if (event && event.alpha !== null && headingFromCompass === null) {
                headingFromCompass = 360 - event.alpha;
            }
        }, true);
    }

    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
            .then(res => { if (res === 'granted') enableCompass(); })
            .catch(() => {});
    } else {
        enableCompass();
    }

    // --- GPS sledování polohy ---
    watchId = navigator.geolocation.watchPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const coords = [lon, lat];

        // Přichycení k trase
        const userPoint = turf.point(coords);
        const line = turf.lineString(route.geometry.coordinates);
        const snapped = turf.nearestPointOnLine(line, userPoint);
        const distance = turf.distance(userPoint, snapped, { units: 'meters' });
        const displayCoords = (distance <= 5) ? snapped.geometry.coordinates : coords;

        // Marker polohy
        if (!userMarker) {
            const el = document.createElement('div');
            el.style.width = '16px';
            el.style.height = '16px';
            el.style.background = '#007bff';
            el.style.borderRadius = '50%';
            el.style.border = '2px solid white';
            el.style.pointerEvents = 'none';
            userMarker = new maplibregl.Marker(el).setLngLat(displayCoords).addTo(map);
        } else {
            userMarker.setLngLat(displayCoords);
        }

        userHeadingMarker.setLngLat(displayCoords);

        // --- Heading ---
        let heading = headingFromCompass;
        if (heading === null && lastCoords) {
            const dx = displayCoords[0] - lastCoords[0];
            const dy = displayCoords[1] - lastCoords[1];
            heading = Math.atan2(dy, dx) * 180 / Math.PI;
        }

        // --- Vyhlazení ---
        if (heading !== null) {
            const diff = ((heading - smoothedHeading + 540) % 360) - 180;
            smoothedHeading = (smoothedHeading + diff * 0.2 + 360) % 360;
        }

        // --- Otáčení cone podle kompasu / pohybu ---
        if (heading !== null) {
            coneEl.style.transform = `rotate(${smoothedHeading}deg)`;
        }

        lastCoords = displayCoords;

        if (followUser) {
            map.easeTo({
                center: displayCoords,
                pitch: navigating ? 60 : map.getPitch(),
                bearing: navigating ? -20 : map.getBearing(),
                zoom: navigating ? 18 : map.getZoom(),
                duration: 1000
            });
        }
    }, err => console.warn('Nelze zjistit polohu:', err.message), { enableHighAccuracy: true });
}
        </script>
    </body>
</html>
