<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Map Bistro Florenc 3D</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css"/>
  <style>
    html, body, #map {
      height:100%;
      margin:0;
      padding:0;
    }
    #consent-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #222;
      color: #fff;
      padding: 10px;
      text-align: center;
      z-index: 9999;
      font-family: sans-serif;
    }
    #consent-banner button {
      margin-left:10px;
      padding:5px 10px;
      cursor:pointer;
    }
    #consent-banner button:hover {
      scale: 1.05;
      background-color: #4ff749;
    }

    #navigate-btn {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 9999;
      padding: 10px 15px;
      font-size: 16px;
      background-color: #222;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
    }
    #navigate-btn:hover { scale: 1.05; }
    #navigate-btn:active { background-color: #555; }
  </style>
</head>
<body>
  <div id="consent-banner">
    <span id="consent-text"></span>
    <button id="consent-yes"></button>
  </div>

  <div id="map"></div>
  <button id="navigate-btn">Navigovat</button>

  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script>
    // --- Překlady ---
    const translations = {
      cs: { text: "Souhlasíte se zobrazením Vaší aktuální polohy na mapě?", button: "Souhlasím" },
      en: { text: "Do you consent to displaying your current location on the map?", button: "I consent" }
    };
    const userLang = navigator.language.split('-')[0];
    const lang = translations[userLang] ? userLang : 'en';
    document.getElementById('consent-text').textContent = translations[lang].text;
    document.getElementById('consent-yes').textContent = translations[lang].button;

    // --- MapLibre GL setup ---
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://api.maptiler.com/maps/streets/style.json?key=Pc9uiLvzyWXr8WnVXScH',
      center: [14.4399, 50.0896],
      zoom: 18,
      pitch: 60,   // naklonění pro 3D efekt
      bearing: -20, // natočení kamery
      antialias: true
    });

    map.addControl(new maplibregl.NavigationControl());

    map.on('load', () => {
      // --- 3D budovy ---
      const layers = map.getStyle().layers;
      let labelLayerId;
      for (let i = 0; i < layers.length; i++) {
        if (layers[i].type === 'symbol' && layers[i].layout['text-field']) {
          labelLayerId = layers[i].id;
          break;
        }
      }

      // Vrstva s 3D budovami
      map.addLayer({
        'id': '3d-buildings',
        'source': 'openmaptiles', // zdroj je součástí stylu MapTileru
        'source-layer': 'building',
        'type': 'fill-extrusion',
        'minzoom': 15,
        'paint': {
          'fill-extrusion-color': '#aaa',
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['get', 'min_height'],
          'fill-extrusion-opacity': 0.6
        }
      }, labelLayerId);
    });

    // --- Kužel marker pro polohu uživatele ---
    let userMarker = null;
    let followUser = false;

    function createUserIcon(angle = 0) {
      const circleRadius = 8;
      const coneHeight = 25;
      const coneWidth = 16;
      const totalHeight = coneHeight + circleRadius * 2;
      const cx = coneWidth / 2;

      const svg = `
        <svg width="${coneWidth}" height="${totalHeight}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;">
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="0" y2="${coneHeight}" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="rgba(0,100,255,0.7)"/>
              <stop offset="100%" stop-color="rgba(0,100,255,0)"/>
            </linearGradient>
          </defs>
          <polygon 
            points="${cx},${totalHeight - circleRadius} ${cx - coneWidth/2},${totalHeight - circleRadius - coneHeight} ${cx + coneWidth/2},${totalHeight - circleRadius - coneHeight}"
            fill="url(#grad)"
            transform="rotate(${angle}, ${cx}, ${totalHeight - circleRadius})"
          />
          <circle 
            cx="${cx}" 
            cy="${totalHeight - circleRadius}" 
            r="${circleRadius}" 
            fill="#66b3ff" 
            stroke="#fff" 
            stroke-width="2"
          />
        </svg>
      `;

      const el = document.createElement('div');
      el.innerHTML = svg;
      el.style.width = coneWidth + 'px';
      el.style.height = totalHeight + 'px';

      return el;
    }

    // --- Consent button ---
    document.getElementById('consent-yes').addEventListener('click', () => {
      document.getElementById('consent-banner').style.display = 'none';
      initGeolocation();
    });

    // --- Navigate button ---
    document.getElementById('navigate-btn').addEventListener('click', () => {
      followUser = true;
      map.easeTo({ pitch: 60, bearing: -20, zoom: 18 }); // automaticky přejde do 3D
    });

    function initGeolocation() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const newLngLat = [lon, lat];

          if (!userMarker) {
            userMarker = new maplibregl.Marker({ element: createUserIcon(0) })
              .setLngLat(newLngLat)
              .addTo(map);
          } else {
            userMarker.setLngLat(newLngLat);
          }

          if (followUser) {
            map.easeTo({ center: newLngLat, pitch: 60, bearing: -20 });
          }
        }, 
        err => console.warn('Nelze zjistit polohu:', err.message),
        { enableHighAccuracy: true });
      }

      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientationabsolute', e => {
          if (!userMarker) return;
          const alpha = e.alpha || 0;
          const el = userMarker.getElement();
          el.style.transform = `rotate(${alpha}deg)`;
        }, true);
      }
    }
  </script>
</body>
</html>
