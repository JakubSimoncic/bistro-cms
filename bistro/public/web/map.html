<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Map Bistro Florenc</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        html, body, #map {
            height:100%;
            margin:0;
            padding:0;
        }

        #consent-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #222;
            color: #fff;
            padding: 10px;
            text-align: center;
            z-index: 9999;
            font-family: sans-serif;
        }
        #consent-banner button {
            margin-left:10px;
            padding:5px 10px;
            cursor:pointer;
        }
        #consent-banner button:hover {
            scale: 1.05;
            background-color: #4ff749;
        }

        #navigate-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 9999;
            padding: 10px 15px;
            font-size: 16px;
            background-color: #222;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 8px;
            cursor: pointer;
        }
        #navigate-btn:hover { scale: 1.05; }
        #navigate-btn:active { background-color: #555; }
    </style>
</head>
<body>
    <div id="consent-banner">
        <span id="consent-text"></span>
        <button id="consent-yes"></button>
    </div>

    <div id="map"></div>
    <button id="navigate-btn">Navigovat</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const translations = {
            cs: { text: "Souhlasíte se zobrazením Vaší aktuální polohy na mapě?", button: "Souhlasím" },
            en: { text: "Do you consent to displaying your current location on the map?", button: "I consent" }
        };

        const userLang = navigator.language.split('-')[0];
        const lang = translations[userLang] ? userLang : 'en';
        document.getElementById('consent-text').textContent = translations[lang].text;
        document.getElementById('consent-yes').textContent = translations[lang].button;

        // --- Map setup ---
        const map = L.map('map').setView([50.0896, 14.4399], 18);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const route = [
            [50.0894811, 14.4405633],
            [50.0895775, 14.4404008],
            [50.0900086, 14.4401647],
            [50.0899431, 14.4398969],
            [50.0900994, 14.4398225],
            [50.0901481, 14.4400336]
        ];
        L.polyline(route, { color: 'blue', weight: 5 }).addTo(map);
        map.fitBounds(route);

        const bistroLatLng = [50.0901481, 14.4400336];
        const bistroPng = 'LOGO2.png';
        let bistroMarker = L.marker(bistroLatLng, { icon: createBistroIcon(map.getZoom()) }).addTo(map);

        function createBistroIcon(zoom) {
            const size = 35 * (zoom / 18);
            const html = `
                <div style="
                    width:${size}px; height:${size}px;
                    border-radius:50%;
                    border:3px solid black;
                    background-color:white;
                    overflow:hidden;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                ">
                    <img src="${bistroPng}" style="width:100%; height:100%; object-fit:cover;">
                </div>`;
            return L.divIcon({ html: html, className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
        }

        map.on('zoom', () => bistroMarker.setIcon(createBistroIcon(map.getZoom())));

        // --- Google Maps-style user marker ---
        let userCircle = null;
        let userCone = null;
        let followUser = false;

        function updateUserMarker(lat, lon, angle = 0) {
            const circleRadius = 7;
            const coneLength = 25;
            const coneWidth = 15;

            if (!userCircle) {
                userCircle = L.circleMarker([lat, lon], {
                    radius: circleRadius,
                    color: "#fff",
                    weight: 2,
                    fillColor: "#4285F4",
                    fillOpacity: 1
                }).addTo(map);

                const coneLatLngs = getConePoints(lat, lon, coneLength, coneWidth, angle);
                userCone = L.polygon(coneLatLngs, {
                    color: "#4285F4",
                    weight: 0,
                    fillOpacity: 0.3
                }).addTo(map);
            } else {
                userCircle.setLatLng([lat, lon]);
                const coneLatLngs = getConePoints(lat, lon, coneLength, coneWidth, angle);
                userCone.setLatLngs(coneLatLngs);
            }
        }

        function getConePoints(lat, lon, length, width, angle) {
            const rad = angle * Math.PI / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);
            const factor = 0.00001; // metr na lat/lon

            return [
                [lat + length * cos * factor, lon + length * sin * factor],       // špička
                [lat - width/2 * sin * factor, lon + width/2 * cos * factor],     // levá základna
                [lat + width/2 * sin * factor, lon - width/2 * cos * factor]      // pravá základna
            ];
        }

        // --- Consent button ---
        document.getElementById('consent-yes').addEventListener('click', () => {
            document.getElementById('consent-banner').style.display = 'none';
            initGeolocation();
        });

        // --- Navigate button ---
        document.getElementById('navigate-btn').addEventListener('click', () => {
            followUser = true;
        });

        function initGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;

                    updateUserMarker(lat, lon, 0);

                    if (followUser) map.setView([lat, lon], map.getZoom());
                }, err => console.warn('Nelze zjistit polohu:', err.message), { enableHighAccuracy: true });
            }

            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientationabsolute', e => {
                    if (!userCircle) return;
                    const alpha = e.alpha || 0;
                    const latlng = userCircle.getLatLng();
                    updateUserMarker(latlng.lat, latlng.lng, alpha);
                }, true);
            }
        }
    </script>
</body>
</html>
