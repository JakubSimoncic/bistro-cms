                .slideshow-container {

                }
                .slide {
                    width: 100vw;  
                    height: 100vh;  
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    overflow: hidden;
                }
                .slide img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    object-position: center;
                }
                .fade {
                    animation: fadeEffect 0.5s ease-in-out;
                }
                @keyframes fadeEffect {
                    from {opacity: 0.5;} 
                    to {opacity: 1;}
                }
            #cornerVideo {
                position: fixed;
                top: 180px;
                left: 20px;
                width: 320px;
                height: 180px;
                background-color: #000;
                border: 2px solid #d4a373;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0,0,0,0.5);
                z-index: 999;
            }
            #cornerVideo iframe {
                width: 100%;
                height: 100%;
                border: none;
                border-radius: 8px;
            }
            #cornerVideoClose {
                position: absolute;
                top: 5px;
                right: 10px;
                color: white;
                font-size: 22px;
                font-weight: bold;
                cursor: pointer;
                -webkit-user-select: none;
                user-select: none;
            }
            #cornerVideoClose:hover {
                color: #d4a373;
            }
            @media (max-width: 768px) {
                #cornerVideo {
                    width: 200px;
                    height: 112px;
                    top: 90px;
                    right: 10px;
                    margin-top: 80px;
                }

                #cornerVideoClose {
                    font-size: 20px;
                    top: 3px;
                    right: 8px;
                }
            }

        <script src="/web/js/script.js"></script>
        <script>
            // Logika pro Slideshow
            let slideIndex = 0;
            showSlides();

            function showSlides() {
                let slides = document.getElementsByClassName("slide");
                if (slides.length === 0) return; // Ochrana, pokud by slides neexistovaly
                for (let i = 0; i < slides.length; i++) {
                    slides[i].style.display = "none";
                }
                slideIndex++;
                if (slideIndex > slides.length) {slideIndex = 1}
                slides[slideIndex - 1].style.display = "block";
                setTimeout(showSlides, 5000);
            }

            // Logika pro zavření plovoucího videa
            document.getElementById('cornerVideoClose').onclick = function() {
                document.getElementById('cornerVideo').style.display = 'none';
            };
        </script>
